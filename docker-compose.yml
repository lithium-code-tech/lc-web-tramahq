services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tramahq
      POSTGRES_PASSWORD: tramahq
      POSTGRES_DB: tramahq
    ports:
      - "5432:5432"
    volumes:
      - tramahq_pgdata:/var/lib/postgresql/data

volumes:
  tramahq_pgdata:
